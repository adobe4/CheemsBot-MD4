name: Android CI (Vin Play M3U)

on:
  push:
    branches:
      - "claude/vin-play-m3u-app-**"
    paths:
      - "VinPlayM3U/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "VinPlayM3U/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VinPlayM3U
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug + run unit tests
        run: ./gradlew :app:assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vin-play-m3u-debug-apk
          path: VinPlayM3U/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
